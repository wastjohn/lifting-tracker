name: Send Weekly Email

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      # No working-directory here; installs requirements.txt from the root level
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Email Script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        # This tells Python to include the src/tracker directory in its search path
        PYTHONPATH: ${{ github.workspace }}/src/tracker
      run: python src/tracker/weekly_email_update.py
