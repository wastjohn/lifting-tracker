name: Send Weekly Email

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC (Adjust cron as needed)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows you to manually trigger the email from the GitHub Actions tab

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Email Script
      env:
        # Pass GitHub secrets into the script environment variables
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      working-directory: ./src/tracker
      run: python weekly_email_update.py