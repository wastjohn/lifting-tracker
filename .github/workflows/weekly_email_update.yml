name: Send Weekly Email

on:
  schedule:
    - cron: "0 9 * * 1"

  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify environment
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python -c "import os; assert all(os.environ.get(k) for k in ['SENDER_EMAIL', 'SENDER_PASSWORD', 'RECEIVER_EMAIL']), 'One or more email secrets are missing'; print('Email secrets are configured')"

      - name: Run Email Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          PYTHONPATH: ${{ github.workspace }}/src/tracker
        run: |
          python -u src/tracker/weekly_email_update.py